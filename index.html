<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Canteen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <h2 class="logo">Campus Canteen</h2>
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Menu</a></li>
                <li><a href="#" class="cart-link">🛒<span id="cart-count" class="cart-badge">0</span></a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>
    <section class="hero">
    <div class="hero-content">
        <h1>Order Food Faster</h1>
        <p>
            Fresh food delivered from your campus canteen.
        </p>
        <a href="#" class="btn">
            View Menu
        </a>
    </div>
</section>
<section class="menu">
    <h2>Popular Menu Items</h2>
    <input
    type="text"
    id="search-box"
    placeholder="Search food..."
    onkeyup="searchFood()">
    <div class="filter-buttons">

    <button onclick="filterFood('all')">
        All
    </button>

    <button onclick="filterFood('meals')">
        Meals
    </button>

    <button onclick="filterFood('snacks')">
        Snacks
    </button>

    <button onclick="filterFood('breakfast')">
        Breakfast
    </button>

</div>
    <div class="menu-container" id = "menu-container">
        
</div>
</section>
<section class="cart-preview">
    <h2>Your Cart</h2>
    <div class="cart-box">
        <div id="cart-items">
            <p id="empty-cart">No items added yet</p>
        </div>
        <h3 id="total">
            Total: ₹0
        </h3>
        <button class="checkout-btn" onclick="checkout()">
            Checkout
        </button>
        <button class="clear-cart-btn" onclick="clearCart()">
    Clear Cart
</button>
        <p id="message"></p>
    </div>
</section>
<section class="order-history">

    <h2>Order History</h2>

    <div id="orders-container">
        <p>Loading orders...</p>
    </div>

</section>
<section class="login-section">

    <h2>Login</h2>

    <form id="login-form">

        <input
            type="email"
            id="login-email"
            placeholder="Enter your email"
            required
        >

        <input
            type="password"
            id="login-password"
            placeholder="Enter your password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p id="login-message"></p>

</section>

<section class="contact">
    <h2>Create Account</h2>
    <form id="signup-form">

    <input
        type="text"
        id="signup-name"
        placeholder="Enter your name"
        required
    >

    <input
        type="email"
        id="signup-email"
        placeholder="Enter your email"
        required
    >

    <input
        type="password"
        id="signup-password"
        placeholder="Enter your password"
        required
    >

    <button type="submit">
        Sign Up
    </button>

</form>

<p id="signup-message"></p>
</section>
<footer>
    <p>© 2026 Campus Canteen. All Rights Reserved.</p>
</footer>
<script src="script.js"></script>
<script src="signup.js"></script>
<script src="login.js"></script>
</body>
</html>
