<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Canteen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <h2 class="logo">Campus Canteen</h2>
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Menu</a></li>
                <li><a href="#" class="cart-link">🛒<span id="cart-count" class="cart-badge">0</span></a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>
    <section class="hero">
    <div class="hero-content">
        <h1>Order Food Faster</h1>
        <p>
            Fresh food delivered from your campus canteen.
        </p>
        <a href="#" class="btn">
            View Menu
        </a>
    </div>
</section>
<section class="menu">
    <h2>Popular Menu Items</h2>
    <input
    type="text"
    id="search-box"
    placeholder="Search food..."
    onkeyup="searchFood()">
    <div class="filter-buttons">

    <button onclick="filterFood('all')">
        All
    </button>

    <button onclick="filterFood('meals')">
        Meals
    </button>

    <button onclick="filterFood('snacks')">
        Snacks
    </button>

    <button onclick="filterFood('breakfast')">
        Breakfast
    </button>

</div>
    <div class="menu-container">
        <div data-category="meals" class="food-card">
            <img src="images/biryani.jpeg" alt="veg Biryani">
    <h3>Veg Biryani</h3>
    <p>₹80</p>

    <button onclick="addToCart('Veg Biryani',80)"
            class="order-btn">
        Add to Cart
    </button>
</div>

<div data-category="snacks" class="food-card">
    <img src="images/burger.jpeg" alt="Burger">
    <h3>Burger</h3>
    <p>₹60</p>

    <button onclick="addToCart('Burger',60)"
            class="order-btn">
        Add to Cart
    </button>
</div>

<div data-category="desserts" class="food-card">
    <img src="images/dosa.jpeg" alt="masala Dosa">
    <h3>Masala Dosa</h3>
    <p>₹50</p>

    <button onclick="addToCart('Masala Dosa',50)"
            class="order-btn">
        Add to Cart
    </button>
</div>
    </div>
</section>
<section class="cart-preview">
    <h2>Your Cart</h2>
    <div class="cart-box">
        <div id="cart-items">
            <p id="empty-cart">No items added yet</p>
        </div>
        <h3 id="total">
            Total: ₹0
        </h3>
        <button class="checkout-btn" onclick="checkout()">
            Checkout
        </button>
        <button class="clear-cart-btn" onclick="clearCart()">
    Clear Cart
</button>
        <p id="message"></p>
    </div>
</section>

<section class="contact">
    <h2>Contact Us</h2>
    <form>
        <input type="text" placeholder="Enter Your Name">
        <input type="email" placeholder="Enter Your Email">
        <textarea placeholder="Enter Your Message"></textarea>
        <button type="submit" class="submit-btn">
            Send Message
        </button>
    </form>
</section>
<footer>
    <p>© 2026 Campus Canteen. All Rights Reserved.</p>
</footer>
<script src="script.js"></script>
</body>
</html>
